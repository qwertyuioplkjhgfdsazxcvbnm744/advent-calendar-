<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b32">
  <meta name="description" content="毎日ひとつずつ開ける、クリスマスのアドベントカレンダー。">
  <title>Mao's Advent Calendar</title>
  <style>
:root{--forest:#123b32;--berry:#a93145;--gold:#e5b95d;--ink:#27332d;--muted:#708077;--paper:#fffefa;--shadow:0 16px 45px #123b321b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#eaf5e8 0,#fff9ed 55%,#f7efdc 100%);color:var(--ink);font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;overflow-x:hidden}.site-header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);background:var(--forest);color:#fff}.brand{color:#fff;text-decoration:none;letter-spacing:.12em;font-size:.88rem}.music-toggle{border:1px solid #ffffff55;border-radius:999px;background:#ffffff12;color:#fff;padding:9px 15px;cursor:pointer;font:inherit}.music-toggle[aria-pressed=true]{background:#ffffff2e}.hero{text-align:center;padding:72px 20px 44px}.eyebrow{font:600 .7rem/1.4 system-ui,sans-serif;letter-spacing:.25em;color:var(--berry)}h1{font-size:clamp(2.25rem,7vw,4.5rem);line-height:1.12;margin:14px 0;color:var(--forest);font-weight:500}h1 span{display:block;color:var(--berry);font-style:italic}.hero-copy{max-width:540px;margin:20px auto;color:#536158;line-height:1.9;font-size:1rem}.countdown{display:inline-flex;align-items:center;gap:9px;border:1px solid #d8c99f;border-radius:999px;padding:9px 16px;color:var(--forest);font:.85rem system-ui,sans-serif}.countdown #countdown-number{font-weight:700;color:var(--berry)}.calendar-section{max-width:880px;margin:0 auto;padding:18px 20px 64px}.section-heading{display:flex;justify-content:center;align-items:center;gap:14px;color:var(--forest)}.section-heading h2{font-size:1.7rem;margin:0;font-weight:500}.section-note{text-align:center;color:var(--muted);font-size:.9rem;margin:10px 0 26px}.calendar-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(9px,2.2vw,18px)}.gift{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:clamp(92px,15vw,132px);border:0;border-radius:14px;color:#fff;cursor:pointer;background:linear-gradient(145deg,#b9454e,#922b3b);box-shadow:0 5px 0 #712131,0 9px 18px #71213122;transition:transform .18s,box-shadow .18s;overflow:hidden}.gift:before,.gift:after{content:"";position:absolute;background:#f3d27c}.gift:before{width:12px;height:100%;left:calc(50% - 6px);top:0}.gift:after{height:11px;width:100%;top:34px;left:0}.gift:hover,.gift:focus-visible{transform:translateY(-5px) rotate(-1deg);box-shadow:0 9px 0 #712131,0 16px 24px #7121312c;outline:3px solid #e5b95d;outline-offset:3px}.gift-number{z-index:1;position:relative;margin-top:20px;font:700 clamp(1.35rem,4vw,2rem)/1 system-ui,sans-serif;text-shadow:0 2px 2px #45111b66}.gift-bow{position:absolute;top:17px;z-index:1;font-size:1.15rem;color:#f8df9c}.gift.opened{background:linear-gradient(145deg,#30745b,#205642)}.gift.opened:before,.gift.opened:after{background:#e9cd83}.gift.special{background:linear-gradient(145deg,#d1a64c,#99702c);box-shadow:0 5px 0 #74501c,0 9px 18px #74501c22}.gift.special .gift-number{font-size:clamp(1.7rem,5vw,2.5rem)}.day-view{max-width:760px;margin:0 auto 80px;padding:clamp(22px,5vw,48px);background:var(--paper);border:1px solid #e9dfc9;border-radius:22px;box-shadow:var(--shadow);scroll-margin-top:24px}.day-top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #eee7da;padding-bottom:20px}.day-top h2{margin:0;color:var(--forest);font-size:clamp(1.6rem,5vw,2.3rem);font-weight:500}.back-link,.day-nav a{color:var(--berry);text-decoration:none;font:600 .9rem system-ui,sans-serif}.day-content{padding-top:10px}.content-block{margin:25px 0}.content-block h3{font-size:1.12rem;color:var(--forest);margin:0 0 10px}.content-block p{line-height:1.9;margin:0;white-space:pre-line}.content-block img,.content-block video{display:block;max-width:100%;max-height:520px;border-radius:14px;margin:12px auto;object-fit:contain}.link-list{display:flex;flex-wrap:wrap;gap:10px}.content-link{display:inline-flex;padding:11px 16px;border-radius:999px;background:#eff5ee;color:var(--forest);text-decoration:none;font:600 .9rem system-ui,sans-serif}.quiz{padding:20px;border-radius:16px;background:#f6f4eb}.quiz-question{font-weight:600;margin-bottom:14px!important}.quiz-options{display:grid;gap:9px}.quiz-option{display:flex;gap:9px;align-items:flex-start;line-height:1.55}.quiz-check{margin-top:4px;accent-color:var(--forest)}.quiz-submit{margin-top:15px;border:0;border-radius:999px;background:var(--forest);color:white;padding:10px 17px;cursor:pointer;font:inherit}.quiz-result{margin-top:12px!important;font-weight:700}.day-nav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #eee7da;margin-top:28px;padding-top:20px}.signoff{text-align:center;color:var(--muted);padding:0 0 34px;font-style:italic}.signoff span{color:var(--berry)}footer{text-align:center;padding:20px;background:var(--forest);color:#d9e4da;font:.76rem system-ui,sans-serif;letter-spacing:.06em}.snow{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.55;background-image:radial-gradient(2px 2px at 20px 30px,#fff 99%,transparent),radial-gradient(2px 2px at 80px 120px,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 150px 70px,#fff 99%,transparent);background-size:200px 180px;animation:snowfall 18s linear infinite}@keyframes snowfall{to{background-position:0 360px}}[hidden]{display:none!important}@media(max-width:520px){.site-header{height:58px}.brand{font-size:.73rem}.music-toggle{padding:7px 11px}.hero{padding-top:52px}.calendar-section{padding-left:14px;padding-right:14px}.calendar-grid{gap:9px}.gift{min-height:82px;border-radius:11px}.gift:after{top:28px;height:9px}.gift:before{width:9px;left:calc(50% - 4.5px)}.gift-bow{top:12px}.gift-number{margin-top:17px}.day-view{margin-left:12px;margin-right:12px}.day-top{align-items:flex-start;flex-direction:column}.day-nav{font-size:.83rem}}

</style>
  <script src="content.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="snow" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="index.html">✦ Merry Christmas ✦</a>
    <button class="music-toggle" type="button" aria-pressed="false">♫ <span>Music</span></button>
  </header>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">A LITTLE SURPRISE EVERY DAY</p>
      <h1 id="page-title">Mao's <span>Advent Calendar</span></h1>
      <p class="hero-copy">プレゼントをひとつずつ開けてね。素敵なクリスマスまで、あと少し！</p>
      <div class="countdown" aria-live="polite"><span id="countdown-number">25</span><span id="countdown-label">日間のサプライズ</span></div>
    </section>
    <section class="calendar-section" aria-label="アドベントカレンダー">
      <div class="section-heading"><span>🎄</span><h2>Choose a day</h2><span>🎄</span></div>
      <p class="section-note">好きな箱をタップしてね</p>
      <div id="calendar" class="calendar-grid"></div>
    </section>
    <section id="day-view" class="day-view" hidden aria-live="polite"></section>
    <p class="signoff">Made with love <span>♥</span></p>
  </main>
  <footer>© <span id="year"></span> Mao's Advent Calendar</footer>
  <script>
/* Edit these samples. Images go in images/, videos go in videos/. */
window.CALENDAR_CONTENT = [
  { day: 1, title: "A little hello", note: "Write a warm message here. This is your space to make the day special.", image: "images/day-01.jpg", imageAlt: "A favorite photo", links: [{ label: "A song for today", url: "https://example.com" }], quiz: { question: "Which answer is your favorite?", options: ["First", "Second", "Third"], answer: 0, correct: "You got it!", incorrect: "Try again!" } },
  { day: 2, title: "A small memory", note: "Replace this sample with a note, story, or message." },
  { day: 3, title: "A picture for you", image: "images/day-03.jpg", imageAlt: "Add your image" },
  { day: 4, title: "A video surprise", video: "videos/day-04.mp4", videoLabel: "Watch your video" },
  { day: 5, title: "One little link", links: [{ label: "Open your surprise", url: "https://example.com" }] },
  { day: 6, title: "A note for today", note: "Write anything you'd like to share." },
  { day: 7, title: "A photo memory", image: "images/day-07.jpg", imageAlt: "Add your image" },
  { day: 8, title: "Today's quiz", quiz: { question: "What makes today special?", options: ["A surprise", "A little joy", "Both!"], answer: 2, correct: "Exactly!", incorrect: "Have another guess." } },
  { day: 9, title: "A message", note: "Your message goes here." },
  { day: 10, title: "A video greeting", video: "videos/day-10.mp4" },
  { day: 11, title: "Something lovely", note: "Write a small message or an inside joke." },
  { day: 12, title: "A favorite picture", image: "images/day-12.jpg", imageAlt: "Add your image" },
  { day: 13, title: "Explore this", links: [{ label: "Open the link", url: "https://example.com" }] },
  { day: 14, title: "Quick quiz", quiz: { question: "Pick the answer!", options: ["A", "B", "C"], answer: 1, correct: "That's right!", incorrect: "Give it another try." } },
  { day: 15, title: "Halfway to Christmas", note: "Add a special note for today." },
  { day: 16, title: "A photo from me", image: "images/day-16.jpg", imageAlt: "Add your image" },
  { day: 17, title: "A tiny film", video: "videos/day-17.mp4" },
  { day: 18, title: "A little note", note: "Write anything you'd like." },
  { day: 19, title: "A place to visit", links: [{ label: "See the surprise", url: "https://example.com" }] },
  { day: 20, title: "Three weeks of surprises", note: "Only a few more days until Christmas!" },
  { day: 21, title: "A favorite moment", image: "images/day-21.jpg", imageAlt: "Add your image" },
  { day: 22, title: "One more quiz", quiz: { question: "Ready for Christmas?", options: ["Yes!", "Absolutely!"], answer: 1, correct: "Me too!", incorrect: "Try again!" } },
  { day: 23, title: "Almost there", note: "Write a note for the day before Christmas Eve." },
  { day: 24, title: "Christmas Eve", video: "videos/day-24.mp4", note: "Merry Christmas Eve!" },
  { day: 25, title: "Merry Christmas!", note: "Merry Christmas! I hope your day is full of warmth, laughter, and lovely surprises. Add your own message here.", image: "images/day-25.jpg", imageAlt: "Christmas surprise" }
];

</script>
  <script>
(() => {
  const entries = window.CALENDAR_CONTENT || [];
  const calendar = document.getElementById("calendar");
  const view = document.getElementById("day-view");
  const params = new URLSearchParams(location.search);
  const requested = Number(params.get("day"));
  const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  for (let day = 1; day <= 25; day++) {
    const button = document.createElement("a");
    button.className = `gift${day === 25 ? " special" : ""}`;
    button.href = `?day=${day}#day-view`;
    button.setAttribute("aria-label", `Open day ${day}`);
    button.innerHTML = `<span class="gift-bow" aria-hidden="true">✦</span><span class="gift-number">${day === 25 ? "★" : day}</span>`;
    calendar.append(button);
  }

  function block(title, body) {
    if (!body) return "";
    return `<section class="content-block"><h3>${title}</h3>${body}</section>`;
  }
  function renderDay(day) {
    const entry = entries.find((item) => item.day === day) || { day, title: `Day ${day}`, note: "Write a note for this day in content.js." };
    const notes = entry.note ? `<p>${escapeHtml(entry.note)}</p>` : "";
    const image = entry.image ? `<img src="${escapeHtml(entry.image)}" alt="${escapeHtml(entry.imageAlt || "")}" loading="lazy" onerror="this.hidden=true">` : "";
    const video = entry.video ? `<video controls playsinline preload="metadata"><source src="${escapeHtml(entry.video)}">お使いのブラウザでは動画を再生できません。</video>` : "";
    const links = Array.isArray(entry.links) && entry.links.length ? `<div class="link-list">${entry.links.map((link) => `<a class="content-link" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.label || link.url)} ↗</a>`).join("")}</div>` : "";
    let quiz = "";
    if (entry.quiz) {
      const q = entry.quiz;
      const options = (q.options || []).map((option, index) => `<label class="quiz-option"><input class="quiz-check" type="radio" name="quiz-${day}" value="${index}"><span>${escapeHtml(option)}</span></label>`).join("");
      quiz = `<div class="quiz"><p class="quiz-question">${escapeHtml(q.question)}</p><div class="quiz-options">${options}</div><button class="quiz-submit" type="button">答えをチェック</button><p class="quiz-result" role="status"></p></div>`;
      setTimeout(() => {
        const quizBox = view.querySelector(".quiz");
        if (!quizBox) return;
        quizBox.querySelector(".quiz-submit").addEventListener("click", () => {
          const selected = quizBox.querySelector(`input[name="quiz-${day}"]:checked`);
          const result = quizBox.querySelector(".quiz-result");
          if (!selected) { result.textContent = "答えを選んでね。"; return; }
          result.textContent = Number(selected.value) === Number(q.answer) ? (q.correct || "正解！") : (q.incorrect || "もう一回考えてみてね。");
        });
      }, 0);
    }
    const previous = day > 1 ? `<a href="?day=${day - 1}#day-view">← Day ${day - 1}</a>` : "<span></span>";
    const next = day < 25 ? `<a href="?day=${day + 1}#day-view">Day ${day + 1} →</a>` : "<span></span>";
    view.innerHTML = `<div class="day-top"><h2>🎁 Day ${day} — ${escapeHtml(entry.title || "A surprise for you")}</h2><a class="back-link" href="index.html">← Calendar</a></div><div class="day-content">${block("💌 Note", notes)}${block("📷 Photo", image)}${block("🎬 Video", video)}${block("🔗 Links", links)}${block("❓ Quiz", quiz)}</div><nav class="day-nav" aria-label="Other days">${previous}${next}</nav>`;
    view.hidden = false;
    document.querySelectorAll(".gift").forEach((gift) => { if (gift.getAttribute("aria-label") === `Open day ${day}`) gift.classList.add("opened"); });
  }

  if (requested >= 1 && requested <= 25) {
    renderDay(requested);
    requestAnimationFrame(() => view.scrollIntoView({ behavior: "smooth", block: "start" }));
  }
  const now = new Date();
  document.getElementById("year").textContent = now.getFullYear();
  const christmas = new Date(now.getFullYear(), 11, 25);
  if (now > christmas) christmas.setFullYear(christmas.getFullYear() + 1);
  const daysLeft = Math.ceil((christmas - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  document.getElementById("countdown-number").textContent = daysLeft;
  document.getElementById("countdown-label").textContent = daysLeft === 1 ? "day until Christmas" : "days until Christmas";
})();

</script>
  <script>
/* Optional background music: put an audio file in audio/christmas.mp3 and uncomment the source below. */
(() => {
  const button = document.querySelector(".music-toggle");
  if (!button) return;
  const audio = new Audio("audio/christmas.mp3");
  audio.loop = true;
  button.addEventListener("click", async () => {
    try {
      if (audio.paused) { await audio.play(); button.setAttribute("aria-pressed", "true"); button.querySelector("span").textContent = "Music on"; }
      else { audio.pause(); button.setAttribute("aria-pressed", "false"); button.querySelector("span").textContent = "Music"; }
    } catch { button.querySelector("span").textContent = "Add music file"; }
  });
})();

</script>
</body>
</html>
